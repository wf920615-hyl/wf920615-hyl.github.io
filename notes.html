<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>动态与分享 | 王飞 Fei Wang</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .archive-hero{padding:110px 0 42px;background:linear-gradient(180deg,#f5faff 0%,#fff 100%)}
    .archive-title{font-size:42px;margin:8px 0 12px;color:#17365d}
    .archive-sub{max-width:780px;color:#5c6f82;line-height:1.8}
    .archive-wrap{padding:42px 0 80px}
    .filter-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
    .filter-btn{border:1px solid #d7e5f2;background:#fff;color:#294a6d;border-radius:999px;padding:9px 16px;cursor:pointer}
    .filter-btn.active{background:#4e87bd;color:#fff;border-color:#4e87bd}
    .archive-list{display:grid;gap:14px}
    .archive-item{display:grid;grid-template-columns:110px 1fr 110px;gap:20px;align-items:center;padding:20px 22px;background:#fff;border:1px solid #e2ebf3;border-radius:16px}
    .archive-date{font-weight:700;color:#4e87bd}
    .archive-cat{font-size:13px;color:#67809a;margin-bottom:6px}
    .archive-body h2{font-size:17px;line-height:1.55;margin:0;color:#203a57;font-weight:600}
    .archive-link{white-space:nowrap;text-align:right}
    @media(max-width:760px){
      .archive-title{font-size:32px}
      .archive-item{grid-template-columns:1fr;gap:8px}
      .archive-link{text-align:left}
    }
  </style>
</head>
<body>
<header class="site-header">
  <div class="container nav-wrap">
    <a class="brand" href="index.html">FW</a>
    <nav class="desktop-nav">
      <a href="index.html" data-zh="返回主页" data-en="Home">返回主页</a>
      <a href="publications.html" target="_blank" data-zh="论文列表" data-en="Publications">论文列表</a>
    </nav>
    <div class="nav-actions"><button id="langBtn" class="lang-btn">EN</button></div>
  </div>
</header>

<main>
<section class="archive-hero">
  <div class="container">
    <div class="eyebrow">News & Notes</div>
    <h1 class="archive-title" data-zh="动态与分享" data-en="News & Notes">动态与分享</h1>
    <p class="archive-sub" data-zh="课题组科研成果、学生与学术活动，以及学习分享。" data-en="Research updates, student and academic activities, and learning notes.">课题组科研成果、学生与学术活动，以及学习分享。</p>
  </div>
</section>

<section class="archive-wrap">
  <div class="container">
    <div class="filter-row">
      <button class="filter-btn active" data-filter="all" data-zh="全部" data-en="All">全部</button>
      <button class="filter-btn" data-filter="research" data-zh="科研动态" data-en="Research Updates">科研动态</button>
      <button class="filter-btn" data-filter="activity" data-zh="学生与学术活动" data-en="Students & Events">学生与学术活动</button>
      <button class="filter-btn" data-filter="learning" data-zh="学习分享" data-en="Learning Notes">学习分享</button>
    </div>
    <div class="archive-list" id="notesList"></div>
  </div>
</section>
</main>

<footer class="footer"><div class="container footer-row"><span>© <span id="year"></span> Fei Wang</span><span>Qufu Normal University · Academic Homepage</span></div></footer>

<script src="script.js"></script>
<script src="notes-data.js"></script>
<script>
(function(){
  const root = document.getElementById('notesList');
  const btns = [...document.querySelectorAll('.filter-btn')];
  if(!root || !Array.isArray(window.NOTES_DATA)) return;

  function render(filter='all'){
    const items = [...window.NOTES_DATA]
      .sort((a,b)=>b.date.localeCompare(a.date))
      .filter(p=>filter==='all' || p.category===filter);

    root.innerHTML = items.map(p => `
      <article class="archive-item" data-cat="${p.category}">
        <div class="archive-date">${p.date}</div>
        <div class="archive-body">
          <div class="archive-cat" data-zh="${p.category_zh}" data-en="${p.category_en}">${p.category_zh}</div>
          <h2>${p.title}</h2>
        </div>
        <a class="archive-link" href="${p.url}" target="_blank" rel="noopener" data-zh="微信原文 ↗" data-en="WeChat ↗">微信原文 ↗</a>
      </article>`).join('');
  }

  btns.forEach(btn=>btn.addEventListener('click',()=>{
    btns.forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    render(btn.dataset.filter);
  }));

  render();
})();
</script>
</body>
</html>
